extends: base.yaml
# State preset with ArchVarietyV2 and original train/eval episode limits.
seed: null
device: cpu

agent:
  kind: synchron
  n_worker: 4
  worker_device: cpu

env:
  obs: state
  eval_mode: eval
  simulation_mp: true
  n_max_steps: 150
  eval_n_max_steps: 450

runner:
  heatup_action_low: [-10.0, -1.0]
  heatup_action_high: [25.0, 3.14]
  info_results: null  # Record all environment info metrics, as in the original.

replay:
  capacity_episodes: 10000
  batch_size: 32

training:
  heatup_steps: 500000
  training_steps: 10000000
  explore_steps_between_eval: 50000
  explore_episodes_between_updates: 100
  update_steps_per_explore_step: 0.05
  eval_seeds: [1, 2, 3, 5, 6, 7, 8, 9, 10, 12, 13, 14, 16, 17, 18, 21, 22, 23, 27, 31, 34, 35, 37, 39, 42, 43, 44, 47, 48, 50, 52, 55, 56, 58, 61, 62, 63, 68, 69, 70, 71, 73, 79, 80, 81, 84, 89, 91, 92, 93, 95, 97, 102, 103, 108, 109, 110, 115, 116, 117, 118, 120, 122, 123, 124, 126, 127, 128, 129, 130, 131, 132, 134, 136, 138, 139, 140, 141, 142, 143, 144, 147, 148, 149, 150, 151, 152, 154, 155, 156, 158, 159, 161, 162, 167, 168, 171, 175, 190, 180]
